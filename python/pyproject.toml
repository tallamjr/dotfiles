[project]
name = "main"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "black",
    "neovim",
    "pytest",
    "pytest-cov",
    "pytest-subtests",
    "pep517",
    "twine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
python = "3.12"